# SPDX-License-Identifier: AGPL-3.0-only
#
# CloverEye for Windows: the Tauri app built on a Windows runner, as an NSIS
# installer (.exe) and an MSI for x64, and an NSIS installer for ARM64
# (cross-compiled on the same x64 runner). They install WebView2 if the
# machine lacks it.
# Run by hand (Actions → Windows → Run workflow) or by a v* tag; the
# installers are the run's artifact, attached to the release by hand.

name: Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Windows installers (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            src-tauri/target
          key: windows-cargo-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'Cargo.lock') }}

      - name: Tauri CLI
        shell: bash
        run: command -v cargo-tauri || cargo install tauri-cli --version '^2' --locked

      # the tests run on the x64 build only: an ARM64 build cannot run here
      - name: Unit tests (fetch crate, app)
        if: matrix.arch == 'x64'
        shell: bash
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build the installers
        shell: bash
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Name them for the release
        shell: bash
        run: |
          v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          b=target/${{ matrix.target }}/release/bundle
          [ -d "$b" ] || b=src-tauri/$b
          cp "$b"/nsis/*.exe "out/CloverEye-$v-${{ matrix.arch }}-setup.exe"
          if [ "${{ matrix.arch }}" = x64 ]; then cp "$b"/msi/*.msi "out/CloverEye-$v-x64.msi"; fi
          ls -l out
          sha256sum out/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clovereye-windows-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
