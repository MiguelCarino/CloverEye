<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CloverEye">
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2414"/>
      <stop offset="1" stop-color="#0d0b07"/>
    </linearGradient>
    <linearGradient id="ce-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#b07a12"/>
    </linearGradient>
    <linearGradient id="ce-stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9b43c"/>
      <stop offset="1" stop-color="#9a6a0e"/>
    </linearGradient>
    <!-- one heart-shaped leaf, tip at the origin, lobes pointing up -->
    <path id="ce-leaf" d="M0 0C-34 -26 -106 -62 -104 -122C-102 -168 -48 -186 0 -140C48 -186 102 -168 104 -122C106 -62 34 -26 0 0Z"/>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#ce-bg)"/>
  <path d="M262 262C286 330 330 382 392 414" fill="none" stroke="url(#ce-stem)" stroke-width="22" stroke-linecap="round"/>
  <g transform="translate(256 248)">
    <g fill="url(#ce-gold)" stroke="#7a5208" stroke-width="5" stroke-linejoin="round">
      <use href="#ce-leaf" transform="rotate(-45) scale(0.98)"/>
      <use href="#ce-leaf" transform="rotate(45) scale(0.98)"/>
      <use href="#ce-leaf" transform="rotate(135) scale(0.98)"/>
      <use href="#ce-leaf" transform="rotate(225) scale(0.98)"/>
    </g>
    <g stroke="#fff4c8" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round">
      <path d="M0 0L-56 -56" />
      <path d="M0 0L56 -56" />
      <path d="M0 0L56 56" />
      <path d="M0 0L-56 56" />
    </g>
    <circle r="26" fill="#0d0b07" stroke="#f2c14e" stroke-width="6"/>
    <circle cx="8" cy="-8" r="7" fill="#fff4c8"/>
  </g>
</svg>
