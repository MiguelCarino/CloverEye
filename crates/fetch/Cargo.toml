[package]
name = "clovereye-fetch"
description = "Polite fetch layer for the 4chan read API: one queue, hard rate floors, conditional requests, back-off."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

[dev-dependencies]
